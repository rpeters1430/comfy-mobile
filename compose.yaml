services:
  image-studio-mobile:
    image: ghcr.io/rpeters1430/comfy-mobile:latest@sha256:2f0aae94a5be196b656a75c058b52f3ed91d3d3817dd7d7f4daeda5c092edcf1
    pull_policy: always
    container_name: image-studio-mobile
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      COMFYUI_URL: ${COMFYUI_URL:?Set your ComfyUI URL}
      STUDIO_TOKEN: ${STUDIO_TOKEN:?Set a strong access token}
      WORKFLOW_DIR: /workflows
      WORKFLOW_SYNC_DIR: /workflow-sync
    volumes:
      - ./workflows:/workflows:ro
      - ./workflow-sync:/workflow-sync
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
