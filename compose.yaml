services:
  image-studio-mobile:
    image: ghcr.io/rpeters1430/comfy-mobile:latest@sha256:1d2e1d25077133192758c814ab820375914b076301d6862ba425477e1ca62dab
    pull_policy: always
    container_name: image-studio-mobile
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      COMFYUI_URL: ${COMFYUI_URL:?Set your ComfyUI URL}
      STUDIO_TOKEN: ${STUDIO_TOKEN:?Set a strong access token}
      WORKFLOW_DIR: /workflows
      WORKFLOW_SYNC_DIR: /workflow-sync
      DATA_DIR: /data
      SEARXNG_URL: ${SEARXNG_URL:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      ADVISER_PROVIDER: ${ADVISER_PROVIDER:-ollama}
      ADVISER_MODEL: ${ADVISER_MODEL:-}
      ADVISER_BASE_URL: ${ADVISER_BASE_URL:-}
      ADVISER_API_KEY: ${ADVISER_API_KEY:-}
      WOL_MAC: ${WOL_MAC:-}
      WOL_BROADCAST: ${WOL_BROADCAST:-}
    volumes:
      - ./workflows:/workflows:ro
      - ./workflow-sync:/workflow-sync
      # Job records, gallery thumbnails and push keys. Must be writable by uid 1000.
      - ./data:/data
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
