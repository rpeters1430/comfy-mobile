services:
  image-studio-mobile:
    image: ghcr.io/rpeters1430/comfy-mobile:latest@sha256:4361b197bbd4b4479729f3006041849b4049bbf550310971e2abecd2a67d34c8
    pull_policy: always
    container_name: image-studio-mobile
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      COMFYUI_URL: ${COMFYUI_URL:?Set your ComfyUI URL}
      STUDIO_TOKEN: ${STUDIO_TOKEN:?Set a strong access token}
      WORKFLOW_DIR: /workflows
      WORKFLOW_SYNC_DIR: /workflow-sync
    volumes:
      - ./workflows:/workflows:ro
      - ./workflow-sync:/workflow-sync
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
