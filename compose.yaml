services:
  image-studio-mobile:
    image: ghcr.io/rpeters1430/comfy-mobile:latest@sha256:8ac63c067d7723d53c0ca19502edabf11483e85fc8d48f7e330213826d125622
    pull_policy: always
    container_name: image-studio-mobile
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      COMFYUI_URL: ${COMFYUI_URL:?Set your ComfyUI URL}
      STUDIO_TOKEN: ${STUDIO_TOKEN:?Set a strong access token}
      WORKFLOW_DIR: /workflows
      WORKFLOW_SYNC_DIR: /workflow-sync
      DATA_DIR: /data
    volumes:
      - ./workflows:/workflows:ro
      - ./workflow-sync:/workflow-sync
      # Job records, gallery thumbnails and push keys. Must be writable by uid 1000.
      - ./data:/data
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
