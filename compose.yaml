services:
  image-studio-mobile:
    image: ghcr.io/rpeters1430/comfy-mobile:latest@sha256:91ebc762ef55c234bcf854a2a38faeaa11ce91b8c36cd543fe32a7109217f8f3
    pull_policy: always
    container_name: image-studio-mobile
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      COMFYUI_URL: ${COMFYUI_URL:?Set your ComfyUI URL}
      STUDIO_TOKEN: ${STUDIO_TOKEN:?Set a strong access token}
      WORKFLOW_DIR: /workflows
      WORKFLOW_SYNC_DIR: /workflow-sync
    volumes:
      - ./workflows:/workflows:ro
      - ./workflow-sync:/workflow-sync
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
