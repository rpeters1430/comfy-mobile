services:
  image-studio-mobile:
    image: ghcr.io/rpeters1430/comfy-mobile:latest@sha256:b91339ed526df4c11434646c8d852e8a79101fcd97f0cfc25d123dffb0c8021f
    pull_policy: always
    container_name: image-studio-mobile
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      COMFYUI_URL: ${COMFYUI_URL:?Set your ComfyUI URL}
      STUDIO_TOKEN: ${STUDIO_TOKEN:?Set a strong access token}
      WORKFLOW_DIR: /workflows
      WORKFLOW_SYNC_DIR: /workflow-sync
      DATA_DIR: /data
      SEARXNG_URL: ${SEARXNG_URL:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      ADVISER_PROVIDER: ${ADVISER_PROVIDER:-ollama}
      ADVISER_MODEL: ${ADVISER_MODEL:-}
      ADVISER_BASE_URL: ${ADVISER_BASE_URL:-}
      ADVISER_API_KEY: ${ADVISER_API_KEY:-}
      WOL_MAC: ${WOL_MAC:-}
      WOL_BROADCAST: ${WOL_BROADCAST:-}
      MODELHARBOR_URL: ${MODELHARBOR_URL:-}
      MODELHARBOR_TOKEN: ${MODELHARBOR_TOKEN:-}
    volumes:
      - ./workflows:/workflows:ro
      - ./workflow-sync:/workflow-sync
      # Job records, gallery thumbnails and push keys. Must be writable by uid 1000.
      - ./data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
